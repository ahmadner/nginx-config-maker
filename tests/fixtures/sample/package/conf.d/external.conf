# Generated by Nginx Config Generator from project "Sample environment (placeholders)".
# Server configuration "External gateway" - Public application traffic

# Catch-all for external applications
server {
    listen      8444 default_server;
    server_name _;

    client_max_body_size 100M;

    access_log /var/log/nginx/external/_default.access.log main;
    error_log  /var/log/nginx/external/_default.error.log;

    # ── Pair A (192.0.2.11 / .12) ────────────────────────────────────────────
    location /portal/ {
        access_log /var/log/nginx/external/portal.access.log main;
        error_log  /var/log/nginx/external/portal.error.log;
        include    /etc/nginx/proxy_params.conf;
        proxy_pass http://ext_portal;
    }
    location /portal/ws/ {
        access_log /var/log/nginx/external/portal-ws.access.log main;
        error_log  /var/log/nginx/external/portal-ws.error.log;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://ext_portal;
    }

    # ── Payments (192.0.2.21 - .23) ──────────────────────────────────────────
    location /payments/ {
        access_log /var/log/nginx/external/payments.access.log main;
        error_log  /var/log/nginx/external/payments.error.log;
        include    /etc/nginx/proxy_params.conf;
        proxy_read_timeout 120s;
        proxy_pass http://ext_payments;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Partner API: listed partner networks only
server {
    listen      8445;
    server_name api.example.com;

    access_log /var/log/nginx/external/_default.access.log main;
    error_log  /var/log/nginx/external/_default.error.log;

    allow 203.0.113.0/24;
    deny  all;

    limit_req        zone=partner_api burst=40 nodelay;
    limit_req_status 429;

    add_header X-Environment "sample" always;

    location /v1/ {
        access_log /var/log/nginx/external/partner-v1.access.log main;
        error_log  /var/log/nginx/external/partner-v1.error.log;
        include    /etc/nginx/proxy_params.conf;
        limit_except GET POST {
            deny all;
        }
        proxy_pass http://ext_payments/api/v1/;
    }
}
