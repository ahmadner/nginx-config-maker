# Server configuration "Visitor portal (HTTPS)" - TLS terminated on Nginx

server {
    listen      443 ssl http2;
    server_name visitor.example.com;

    ssl_certificate     /etc/nginx/ssl/visitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/visitor.example.com/privkey.pem;

    include /etc/nginx/ssl_params.conf;
    include /etc/nginx/security_headers.conf;

    access_log /var/log/nginx/visitor.access.log main;
    error_log  /var/log/nginx/visitor.error.log warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    error_page 502 503 504 /50x.html;

    location = / {
        return 301 https://$host/visitor/;
    }

    location /visitor/ {
        proxy_pass http://ext_visitor/visitor/;
    }

    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }
}

# Redirect HTTP to HTTPS
server {
    listen      80;
    server_name visitor.example.com;

    return 301 https://$host$request_uri;
}
